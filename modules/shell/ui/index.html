<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitokey</title>
<link rel="stylesheet" href="window.css">
<script src="window.js" defer></script>
</head>
<body>
<!-- The window in two panes (D61's board): the meetings in a sidebar, the one chosen beside them. -->
<div id="frame" class="frame">
<aside id="sidebar" class="sidebar">
  <div class="side-top">
    <div class="brand">
      <!-- The name alone (D89, the decider 2026-11-09: no mark beside it): its i the mark's stem, cut by the record dot. -->
      <!-- The name: drawn by scripts/name.py, never by hand. -->

<!-- The name's end. -->
    </div>
    <button type="button" id="fold" class="icon-button" aria-keyshortcuts="Control+B Meta+B"></button>
  </div>
  <div class="act"><button type="button" id="record" class="primary"><span class="dot" aria-hidden="true"></span><span id="record-said"></span></button><p id="refused" class="note" role="status" hidden></p><button type="button" id="buy" class="primary" hidden></button></div>
  <div class="finding"><input type="search" id="find" class="search" autocomplete="off" spellcheck="false"></div>
  <main id="list">
    <p id="none-found" class="none" role="status" hidden></p>
    <div id="groups"></div>
  </main>
  <div class="foot">
    <section id="weight" class="weight" aria-live="polite" hidden>
      <div class="total"><strong id="total"></strong> · <span id="taken"></span></div>
      <div id="bar" class="split" role="img"><span id="bar-audio" class="audio"></span><span id="bar-text" class="text"></span></div>
    </section>
    <nav id="sections"><a href="#/free" id="free-link" class="icon-button" hidden></a><button type="button" id="small-link" class="icon-button" hidden></button><a href="#/settings" id="settings-link" class="icon-button"></a></nav>
  </div>
</aside>
<div id="pane" class="pane">
  <button type="button" id="unfold" class="icon-button" aria-keyshortcuts="Control+B Meta+B"></button>
  <a href="#/" id="pane-back" class="back"></a>
  <div id="settings-banner" class="banner" role="status" hidden><p id="settings-banner-said"></p><a href="#/settings" id="settings-banner-link" class="link"></a></div>
  <p id="pane-said" class="note warn" role="status" hidden></p>
  <button type="button" id="pane-again" class="open" hidden></button>
  <section id="empty" class="empty" hidden><div class="card"><p id="none" class="none"></p><p id="none-do" class="says"></p><kbd id="empty-keys" class="keys" hidden></kbd><button type="button" id="empty-record" class="primary"></button><button type="button" id="empty-again" class="primary" hidden></button></div></section>
  <main id="meeting" hidden></main>
  <main id="settings" hidden></main>
  <main id="agree" hidden></main>
  <main id="free" hidden></main>
</div>
</div>
<main id="small" hidden></main>
<main id="welcome" hidden></main>
</body>
</html>
