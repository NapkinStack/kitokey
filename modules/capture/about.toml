# The licences a crate of kitokey-capture may come under (D102): any other, GPL, LGPL or AGPL among
# them, and `cargo about generate` refuses to write the notices.
#
# THIRD-PARTY-NOTICES.html is made from this file, about.hbs and Cargo.lock, and committed;
# tests/notices.rs is red when it no longer names Cargo.lock's crates. Make it again, from this
# folder, with the version pinned here:
#
#   cargo install --locked cargo-about --version 0.9.3 --features cli
#   cargo about generate --locked --fail about.hbs --output-file THIRD-PARTY-NOTICES.html
accepted = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]
# What ships: the crates linked into the program, on the systems it is built for; neither what
# only builds it nor what only tests it.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# kitokey-capture itself is the project's, under LICENSE: not a third party.
private = { ignore = true }


# libflac-sys builds libFLAC and libogg into the program: its notices are its own LICENSE and the
# two Xiph.Org files, and nothing else of its sources — not their C files, which carry the same
# notice in comments, nor FLAC's GPL and LGPL texts, for programs and plugins it does not build.
[libflac-sys.clarify]
license = "BSD-3-Clause"

[[libflac-sys.clarify.files]]
path = "LICENSE"
license = "BSD-3-Clause"
checksum = "85b7daebe41ecc11f8cfd5fce1f654a73fdadec09f89fd61a9e0b2e3409865eb"

[[libflac-sys.clarify.files]]
path = "flac/COPYING.Xiph"
license = "BSD-3-Clause"
checksum = "7866ee98760fc1f0156b4fe6bf530257e02be487ab3fd94e2b63799dd32d6b2c"

[[libflac-sys.clarify.files]]
