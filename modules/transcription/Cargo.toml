[package]
name = "kitokey-transcription"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The transcription service the user names (D43, ADR-0013), as the shell and summary reach theirs.
ureq = { version = "3.4.2", features = ["json"] }
rubato = "5.0.1"
# When the transcript was made whole, written on its `complete` line (transcript/v1, D93).
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
serde_json = "1.0.154"
# A track kept as FLAC once its recording stopped, read as its WAV was (ADR-0016).
symphonia = { version = "0.6.1", default-features = false, features = ["flac"] }
sonora = "0.2.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "env-filter", "std"] }
whisper-rs = "0.16.0"

# The graphics card, where the system has Vulkan and its headers: a tenth of the meeting's
# length on the laptop the engine was chosen on, against most of it on the processor (ADR-0003).
[features]
vulkan = ["whisper-rs/vulkan"]

[dev-dependencies]
# The FLAC a test keeps a track in, as capture writes it (ADR-0016).
libflac-sys = "0.3.4"
jsonschema = { version = "0.58", default-features = false }
tempfile = "3"

# The echo canceller, unoptimised, takes a minute over the half-minute a test gives it: built
# as for a user, it takes a second.
[profile.dev.package.sonora]
opt-level = 3
[profile.dev.package.sonora-aec3]
opt-level = 3
[profile.dev.package.sonora-common-audio]
opt-level = 3
[profile.dev.package.sonora-fft]
opt-level = 3
[profile.dev.package.sonora-simd]
opt-level = 3
