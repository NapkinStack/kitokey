# The licences a crate of kitokey-export may come under (D102): any other, GPL, LGPL or AGPL among
# them, and `cargo about generate` refuses to write the notices.
#
# THIRD-PARTY-NOTICES.html is made from this file, about.hbs and Cargo.lock, and committed;
# tests/notices.rs is red when it no longer names Cargo.lock's crates. Make it again, from this
# folder, with the version pinned here:
#
#   cargo install --locked cargo-about --version 0.9.3 --features cli
#   cargo about generate --locked --fail about.hbs --output-file THIRD-PARTY-NOTICES.html
accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# What ships: the crates linked into the program, on the systems it is built for; neither what
# only builds it nor what only tests it.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# kitokey-export itself is the project's, under LICENSE: not a third party.
private = { ignore = true }

# kamadak-exif states BSD-2-Clause, its licence text in LICENSE: cargo-about read it from a source file,
# code and all, which tests/notices.rs refuses.
[kamadak-exif.clarify]
license = "BSD-2-Clause"

[[kamadak-exif.clarify.files]]
path = "LICENSE"
license = "BSD-2-Clause"
checksum = "17c496a77909a1f26006427d27e58a1d1514baa6a332240aa5fc543e3fa7295d"
